# Pilot: sync this repo's issues to Vikunja (GitHub -> Vikunja integration test).
name: vikunja
on:
  issues:
    types: [opened, edited, closed, reopened]
jobs:
  sync:
    uses: Techsecom/gha-workflows/.github/workflows/vikunja-sync.yml@main
    with:
      vikunja_project_id: "4"
      # Self-hosted runner is in-cluster -> use the Vikunja Service directly.
      vikunja_url: http://vikunja.vikunja.svc.cluster.local:3456
      runs_on: gitops-k8s-runners
    secrets:
      VIKUNJA_API_TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
