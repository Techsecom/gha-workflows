# =============================================================================
# Reusable workflow: GitHub issues -> Vikunja tasks
# =============================================================================
# Lives in a PUBLIC repo so both the Techsecom and galanteum orgs can call it.
# Contains NO secrets — the caller passes VIKUNJA_API_TOKEN (org Actions secret,
# set by Terraform Phase 2). Idempotency: the Vikunja task title is prefixed with
# a stable marker "[<repo>#<number>]" and looked up by search before create.
#
# Caller (in each participating repo, .github/workflows/vikunja.yml):
#   name: vikunja
#   on:
#     issues:
#       types: [opened, edited, closed, reopened]
#   jobs:
#     sync:
#       uses: <PUBLIC_OWNER>/<PUBLIC_REPO>/.github/workflows/vikunja-sync.yml@main
#       with:
#         vikunja_project_id: "42"        # the Vikunja project for this repo
#         # runs_on: gitops-k8s-runners   # Techsecom self-hosted; omit for hosted
#       secrets:
#         VIKUNJA_API_TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
# =============================================================================
name: vikunja-sync

on:
  workflow_call:
    inputs:
      vikunja_project_id:
        description: Numeric Vikunja project ID to sync issues into.
        required: true
        type: string
      vikunja_url:
        description: Base URL of the Vikunja API.
        required: false
        type: string
        default: https://vikunja.ops.techsecom.io
      runs_on:
        description: Runner label (e.g. gitops-k8s-runners for Techsecom self-hosted).
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      VIKUNJA_API_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Sync issue -> Vikunja task
        env:
          API: ${{ inputs.vikunja_url }}
          PROJECT: ${{ inputs.vikunja_project_id }}
          TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $TOKEN"
          JSON="Content-Type: application/json"
          # Stable marker embedded in the task title for idempotent lookup.
          SHORTREPO="${REPO##*/}"
          MARKER="[${SHORTREPO}#${NUMBER}]"
          NEWTITLE="${MARKER} ${TITLE}"
          # Description for Vikunja. Two things this has to get right:
          #
          #   1. `jq -n` (no -r) emits a JSON-ENCODED string, so the description
          #      arrived wrapped in literal double quotes with literal \n instead
          #      of newlines — then --arg re-encoded it below. `-r` emits the raw
          #      string so the single encoding at the --arg boundary is correct.
          #   2. Vikunja stores/renders the description as HTML. An unescaped
          #      body therefore LOSES anything tag-shaped to its sanitizer:
          #      `<audio src={src}>` and `<track>` in a GitHub issue body
          #      disappeared entirely, leaving the surrounding backticks behind
          #      (which is how the sanitizer, rather than plain-text rendering,
          #      was identified). Escape &<> and turn newlines into <br>.
          #
          # Titles are plain text on Vikunja's side and must NOT be escaped —
          # that is why <audio> survives in the title but not the description.
          DESC=$(jq -rn --arg u "$URL" --arg b "${BODY:-}" '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            ("GitHub: " + ($u|esc) + "\n\n" + ($b|esc)) | gsub("\n";"<br>")
          ')

          # Find an existing task by the marker (search covers the title).
          EXISTING=$(curl -sf -G "$API/api/v1/projects/$PROJECT/tasks" \
            -H "$AUTH" --data-urlencode "s=$MARKER" \
            | jq -r --arg m "$MARKER" 'map(select(.title | startswith($m))) | (.[0].id // empty)')

          case "$ACTION" in
            opened|edited|reopened)
              DONE=false
              [ "$ACTION" = "reopened" ] && DONE=false
              if [ -n "$EXISTING" ]; then
                echo "updating task $EXISTING"
                curl -sf -X POST "$API/api/v1/tasks/$EXISTING" -H "$AUTH" -H "$JSON" \
                  -d "$(jq -n --arg t "$NEWTITLE" --arg d "$DESC" --argjson done $DONE \
                        '{title:$t, description:$d, done:$done}')" >/dev/null
              else
                echo "creating task for $MARKER"
                curl -sf -X PUT "$API/api/v1/projects/$PROJECT/tasks" -H "$AUTH" -H "$JSON" \
                  -d "$(jq -n --arg t "$NEWTITLE" --arg d "$DESC" '{title:$t, description:$d}')" >/dev/null
              fi
              ;;
            closed)
              if [ -n "$EXISTING" ]; then
                echo "marking task $EXISTING done"
                # POST /api/v1/tasks/{id} REPLACES the task — it is not a patch.
                # Sending only {"done":true} therefore WIPED the description on
                # every close (proved against the live API: a task with a 57-char
                # description had 0 chars after exactly this call). galanteum#2340
                # was found with done=true and an empty body because of it.
                # Resend title+description alongside `done` so the close marks the
                # task complete without destroying what it says.
                curl -sf -X POST "$API/api/v1/tasks/$EXISTING" -H "$AUTH" -H "$JSON" \
                  -d "$(jq -n --arg t "$NEWTITLE" --arg d "$DESC" \
                        '{title:$t, description:$d, done:true}')" >/dev/null
              else
                echo "no task found for $MARKER; nothing to close"
              fi
              ;;
            deleted)
              # The GitHub issue is GONE, so the task tracking it should go too —
              # otherwise the board accumulates rows pointing at 404s. Closed issues
              # deliberately do NOT come through here: they stay as done tasks so the
              # board remains a record of completed work.
              #
              # NOTE `transferred` is intentionally NOT mapped here. It fires on the
              # SOURCE repo, and deleting there would silently lose the task whenever
              # the destination repo does not also run this sync. A stale task is
              # recoverable; a vanished one is not.
              if [ -n "$EXISTING" ]; then
                echo "deleting task $EXISTING"
                # Not `curl -sf`: under `set -e` a non-2xx would abort the run. A token
                # without DELETE scope must warn, not fail the workflow.
                CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                  -X DELETE "$API/api/v1/tasks/$EXISTING" -H "$AUTH")
                case "$CODE" in
                  2*) echo "deleted task $EXISTING" ;;
                  401|403)
                    echo "::warning::Vikunja token lacks DELETE scope (HTTP $CODE) — task $EXISTING left in place. Mint an API token with delete permission on Tasks and update the VIKUNJA_API_TOKEN secret." ;;
                  *) echo "::warning::unexpected HTTP $CODE deleting task $EXISTING" ;;
                esac
              else
                echo "no task found for $MARKER; nothing to delete"
              fi
              ;;
            *)
              echo "action '$ACTION' not handled; skipping" ;;
          esac
